[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-reader-jp"
version = "0.2.0"
description = "Desktop GUI for Japanese manga OCR, automatic text detection, and reading-order editing"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
  "PySide6>=6.7,<7",
  "Pillow>=10.0,<13",
  "manga-ocr==0.1.16",
  "numpy==1.26.4",
  "onnxruntime==1.20.1",
]

[project.scripts]
manga-reader = "manga_reader.app:main"

[tool.setuptools.packages.find]
include = ["manga_reader*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
